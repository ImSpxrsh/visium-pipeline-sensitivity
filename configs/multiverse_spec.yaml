# MOSAIC Multiverse Specification
# A curated set of defensible spatial-transcriptomics pipelines. This is NOT the
# full Cartesian product (2x2x3x2x3x2x4 ~= 288) — it is a human-readable set of
# representative specs chosen for interpretability. Interns (Adharv) expand this
# with literature-grounded choices toward ~30-40 specs.

global:
  random_state: 42
  n_jobs: 4
  verbose: true

specs:
  # --- canonical -------------------------------------------------------------
  - name: canonical_seurat
    normalization: log1p
    feature_selection: { method: seurat, n_genes: 3000 }
    dimensionality_reduction: { n_components: 30 }
    neighborhood_graph: { type: knn, k_or_radius: 15 }
    clustering: { method: leiden, resolution: 0.5 }
    spatially_variable_genes: { method: morans_i }
    cell_cell_communication: { enabled: false }

  # --- feature-selection variants -------------------------------------------
  - name: conservative_2k_hvgs
