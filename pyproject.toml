[project]
name = "mosaic"
version = "0.1.0"
description = "Multiverse analysis of spatial transcriptomics pipelines (specification-curve analysis + S3 stability score)"
authors = [{ name = "Sparsh", email = "sparsh@csail.mit.edu" }]
requires-python = ">=3.9"
dependencies = [
    "scanpy>=1.9.6",
    "squidpy>=1.4.0",
    "anndata>=0.10.1",
    "pandas>=2.0.3",
    "numpy>=1.24.3",
    "scipy>=1.11.3",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.2",
    "seaborn>=0.12.2",
    "plotly>=5.17.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mosaic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = ["network: test downloads data and needs a network connection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter tolerance
